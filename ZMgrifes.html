    * {

    html,

    /* ===== CONTAINER PRINCIPAL ===== */
    .container {

      filter: drop-shadow(0 2px 12px rgba(0, 0, 0, 0.5));

    /* ===== ÁREA DOS BOTÕES ===== */

      flex-direction: column;
      gap: 16px;
      flex: 1;
      justify-content: center;
      padding: 0 20px;
    }

    /* ===== BOTÃO WHATSAPP (destaque) ===== */
    .btn-whatsapp {

      align-items: center;
      justify-content: center;
      gap: 13px;
      width: 100%;
      height: 64px;
      border-radius: 999px;
      background: #038A06;
      color: #ffffff;
      font-size: 18px;
      font-weight: 700;
      text-decoration: none;
      box-shadow:
        0 0 24px rgba(56, 224, 90, 0.4),

      transition: transform 0.15s ease, box-shadow 0.15s ease;
    }

    .btn-whatsapp:active {
      transform: scale(0.97);
    }

    .btn-whatsapp svg {
      width: 26px;
      height: 26px;
      fill: #ffffff;
    }

      text-transform: uppercase;
      margin: 8px 0 4px;

      border-radius: 18px;
      color: #FAEEDE;
      font-size: 15.5px;
      font-weight: 600;

      border: 1px solid rgba(255, 255, 255, 0.25);

      color: #d4af37;

    @keyframes bounce {
