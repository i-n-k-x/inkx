<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
  <title>inkx</title>
  <style>
    /* ===== RESET E BASE ===== */
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }
    html, body {
      height: 100%;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background: #0a0a0a; /* fundo preto */
      color: #ffffff;
    }
    /* ===== CONTAINER PRINCIPAL ===== */
    .container {
      min-height: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: space-between;
      padding: 48px 24px 32px;
      max-width: 420px;
      margin: 0 auto;
    }
    /* ===== LOGO (topo) ===== */
    .logo {
      margin-top: 0px;
      margin-bottom: 10px;
      display: flex;
      justify-content: center;
      align-items: center;
    }
    .logo img,
    .logo svg {
      width: 100%;
      height: 100%;
      object-fit: contain;
    }
    /* ===== ÁREA DOS BOTÕES ===== */
    .buttons {
      width: 100%;
      display: flex;
      flex-direction: column;
      gap: 18px;
      flex: 1;
      justify-content: center;
    }
    /* ===== ESTILO BASE DOS BOTÕES (mais altos) ===== */
    .btn {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 14px;
      width: 100%;
      height: 68px; /* ← mais gordinho */
      border-radius: 999px; /* mantém bem redondo */
      text-decoration: none;
      font-size: 18.5px; /* ← texto um pouco maior */
      font-weight: 600;
      color: #ffffff;
      box-shadow: 0 6px 18px rgba(0, 0, 0, 0.45);
      transition: transform 0.15s ease, box-shadow 0.15s ease;
    }
    .btn:active {
      transform: scale(0.97);
    }
    /* ===== BOTÃO WHATSAPP ===== */
    .btn-whatsapp {
      background: #25D366;
    }
    /* ===== BOTÃO INSTAGRAM ===== */
    .btn-instagram {
      background: linear-gradient(45deg, #f09433 0%, #e6683c 25%, #dc2743 50%, #cc2366 75%, #bc1888 100%);
    }
    /* ===== BOTÃO GOOGLE MAPS ===== */
    .btn-maps {
      background: #4285F4; /* Azul oficial do Google Maps */
      /* Se preferir o gradiente completo do pin do Maps, descomente a linha abaixo e comente a de cima:
      background: linear-gradient(135deg, #EA4335 0%, #FBBC05 25%, #34A853 50%, #4285F4 100%);
      */
    }
    /* ===== ÍCONES ===== */
    .btn svg {
      width: 26px;
      height: 26px;
      fill: #ffffff;
    }
    /* ===== RODAPÉ CLICÁVEL ===== */
    .footer {
      margin-top: 48px;
      padding-top: 24px;
      border-top: 1px solid #2a2a2a;
      width: 100%;
      text-align: center;
      text-decoration: none;
      color: inherit;
    }
    .footer-brand {
      font-size: 22px;
      font-weight: 700;
      letter-spacing: -0.5px;
      color: #ffffff;
    }
    .footer-link {
      display: block;
      margin-top: 4px;
      font-size: 13px;
      color: #888;
    }
  </style>
</head>
