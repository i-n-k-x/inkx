<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Parcerias • Ink X</title>
  <meta property="og:title" content="Parcerias • Ink X">
  <meta property="og:description" content="Em breve – novas parcerias">
  <meta property="og:image" content="https://inkx.com.br/assets/logo.png">
  <meta property="og:url" content="https://inkx.com.br/parcerias">
  <meta property="og:type" content="website">
  <meta name="description" content="Em breve – parcerias Ink X">
  <style>
    /* ===== RESET E BASE ===== */
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    html, body {
      height: 100%;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background: #0a0a0a;
      color: #ffffff;
      overflow-x: hidden;
    }

    /* ===== CONTAINER PRINCIPAL ===== */
    .container {
      min-height: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: space-between;
      padding: 40px 20px 28px;
      max-width: 420px;
      margin: 0 auto;
    }

    /* ===== LOGO (topo) ===== */
    .logo {
      margin-top: 0px;
      margin-bottom: 20px;
      display: flex;
      justify-content: center;
      align-items: center;
    }
    .logo img {
      width: 70%;
      height: 70%;
      object-fit: contain;
      filter: drop-shadow(0 0 12px rgba(34, 197, 94, 0.25));
    }

    /* ===== CONTEÚDO CENTRAL ===== */
    .content {
      flex: 1;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      text-align: center;
      width: 100%;
      padding: 20px 0;
    }

    .content h1 {
      font-size: 32px;
      font-weight: 700;
      letter-spacing: 1px;
      margin-bottom: 12px;
      background: linear-gradient(135deg, #ffffff 0%, #aaaaaa 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .content .sub {
      font-size: 18px;
      color: #888;
      font-weight: 300;
      letter-spacing: 2px;
      text-transform: uppercase;
      border-top: 1px solid #222;
      padding-top: 16px;
      width: 80%;
    }

    .content .emoji {
      font-size: 56px;
      margin-bottom: 16px;
    }

    /* ===== RODAPÉ ===== */
    .footer {
      margin-top: 36px;
      padding-top: 20px;
      border-top: 1px solid #222;
      width: 100%;
      text-align: center;
      text-decoration: none;
      color: inherit;
    }

    .footer-brand {
      font-size: 13px;
      font-weight: 600;
      letter-spacing: 0.5px;
      color: #888;
    }

    .footer-link {
      display: block;
      margin-top: 4px;
      font-size: 9px;
      color: #666;
      line-height: 1.4;
    }
  </style>
</head>
<body>
  <div class="container">

    <!-- ==================== LOGO ==================== -->
    <div class="logo">
      <img src="assets/logo.png" alt="Ink X">
    </div>

    <!-- ==================== CONTEÚDO ==================== -->
    <div class="content">
      <div class="emoji">🚀</div>
      <h1>Parcerias</h1>
      <div class="sub">Em breve</div>
      <p style="margin-top: 24px; color: #555; font-size: 14px; max-width: 260px;">
        Estamos preparando algo especial.<br>Fique ligado!
      </p>
    </div>

    <!-- ==================== RODAPÉ ==================== -->
    <a class="footer" href="https://inkx.com.br" target="_blank" rel="noopener noreferrer">
      <div class="footer-brand">INKX | parcerias</div>
      <div class="footer-link">criado e mantido por inkx.com.br • 2026 • todos os direitos reservados</div>
    </a>

  </div>

  <!-- JS leve (feedback tátil opcional) -->
  <script>
    document.querySelectorAll('a').forEach(link => {
      link.addEventListener('touchstart', () => {
        link.style.opacity = '0.8';
      }, { passive: true });
      link.addEventListener('touchend', () => {
        link.style.opacity = '1';
      }, { passive: true });
    });
  </script>
</body>
</html>
