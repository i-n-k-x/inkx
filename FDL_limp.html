<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>FDL limp - Limpeza e Impermeabilização de Estofados</title>
  <meta property="og:title" content="FDL limp - Limpeza e Impermeabilização">
  <meta property="og:description" content="Atendimento e redes sociais">
  <meta property="og:image" content="assets/FDL_limp.png">
  <meta property="og:url" content="https://inkx.com.br/FDL_limp">
  <meta property="og:type" content="website">

  <meta property="og:image:height" content="200">
  <meta name="description" content="Atendimento e redes sociais - INKX / ZM Grifes">
  <style>
    /* ===== RESET E BASE ===== */
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    html, body {
      height: 100%;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background: #f8f9fa;
      color: #1a1a1a;
      overflow-x: hidden;
    }

    /* ===== CONTAINER PRINCIPAL ===== */
    .container {
      min-height: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: space-between;
      padding: 40px 20px 28px;
      max-width: 420px;
      margin: 0 auto;
    }
    
    /* ===== LOGO (topo) ===== */
    .logo {
      margin-top: 0px;
      margin-bottom: 20px;
      display: flex;
      justify-content: center;
      align-items: center;
    }
    .logo img,
    .logo svg {
      width: 150%;
      height: 150%;
      object-fit: contain;
      filter: drop-shadow(0 2px 8px rgba(0, 0, 0, 0.08));
    }
    
    /* ===== ÁREA DOS BOTÕES ===== */
    .buttons {
      width: 100%;
      display: flex;
      flex-direction: column;
      gap: 16px;
      flex: 1;
      justify-content: center;
    }

    /* ===== BOTÃO WHATSAPP (destaque) ===== */
    .btn-whatsapp {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 12px;
      width: 100%;
      height: 64px;
      border-radius: 999px;
      background: #25D366;
      color: #ffffff;
      font-size: 17.5px;
      font-weight: 600;
      text-decoration: none;
      box-shadow: 
        0 0 20px rgba(37, 211, 102, 0.35),
        0 4px 14px rgba(0, 0, 0, 0.12);
      transition: transform 0.15s ease, box-shadow 0.15s ease;
    }

    .btn-whatsapp:active {
      transform: scale(0.97);
    }

    .btn-whatsapp svg {
      width: 26px;
      height: 26px;
      fill: #ffffff;
    }

    /* ===== TÍTULO DE DESCRIÇÃO ===== */
    .social-title {
      text-align: center;
      font-size: 14px;
      font-weight: 500;
      color: #555555;
      letter-spacing: 0.3px;
      margin: 8px 0 4px;
    }

    /* ===== GRID 2x2 DAS REDES + REVIEW ===== */
    .social-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
      width: 100%;
    }

    .btn-social {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      height: 58px;
      border-radius: 18px;
      color: #ffffff;
      font-size: 15.5px;
      font-weight: 600;
      text-decoration: none;
      transition: transform 0.15s ease, box-shadow 0.15s ease;
    }

    .btn-social:active {
      transform: scale(0.96);
    }

    .btn-social svg {
      width: 22px;
      height: 22px;
      fill: currentColor;
    }

    /* ===== CORES + SOMBRA SUTIL ===== */
    .btn-instagram {
      background: linear-gradient(45deg, #f09433 0%, #e6683c 25%, #dc2743 50%, #cc2366 75%, #bc1888 100%);
      box-shadow: 0 4px 14px rgba(220, 39, 67, 0.25);
    }

    .btn-google-maps {
      background: #ffffff;
      color: #333333;
      border: 1px solid #e0e0e0;
      box-shadow: 0 4px 14px rgba(0, 0, 0, 0.08);
    }

    .btn-facebook {
      background: #1877F2;
      box-shadow: 0 4px 14px rgba(24, 119, 242, 0.25);
    }

    .btn-avaliar {
      background: #ffffff;
      color: #333333;
      border: 1px solid #e0e0e0;
      box-shadow: 0 4px 14px rgba(0, 0, 0, 0.08);
    }

    /* ===== REVIEW-AREA – seta centralizada ===== */
    .review-area {
      grid-column: 2;
      grid-row: 3;
      display: flex;
      flex-direction: column;
      align-items: flex-end;   /* texto e estrelas à direita */
      gap: 2px;
      padding-top: 4px;
      width: 100%;
    }

    .review-arrow {
      font-size: 18px;
      color: #f4b400;
      line-height: 1;
      animation: bounce 1.6s ease-in-out infinite;
      align-self: center;      /* seta centralizada – nem esquerda nem direita */
    }

    .review-text {
      font-size: 13.5px;
      font-weight: 500;
      color: #555555;
      letter-spacing: 0.2px;
    }

    .review-stars {
      display: flex;
      gap: 4px;
      font-size: 22px;
      line-height: 1;
      color: #f4b400;
      filter: drop-shadow(0 1px 2px rgba(244, 180, 0, 0.35));
    }

    @keyframes bounce {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-4px); }
    }

    /* ===== RODAPÉ ===== */
    .footer {
      margin-top: 36px;
      padding-top: 20px;
      border-top: 1px solid #e5e5e5;
      width: 100%;
      text-align: center;
      text-decoration: none;
      color: inherit;
    }

    .footer-brand {
      font-size: 13px;
      font-weight: 600;
      letter-spacing: 0.5px;
      color: #666666;
    }

    .footer-link {
      display: block;
      margin-top: 4px;
      font-size: 9px;
      color: #999999;
      line-height: 1.4;
    }
  </style>
</head>

  <!-- JS leve (feedback tátil) -->

    document.querySelectorAll('a[class*="btn"]').forEach(btn => {
      btn.addEventListener('touchstart', () => {
        btn.style.opacity = '0.9';
      }, { passive: true });
      btn.addEventListener('touchend', () => {
        btn.style.opacity = '1';
      }, { passive: true });
    });
