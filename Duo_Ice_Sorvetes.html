  <style>
    /* ===== RESET E BASE ===== */
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    html, body {
      height: 100%;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background: #0a0a0a;
      color: #ffffff;
      overflow-x: hidden;
    }

    /* ===== CONTAINER PRINCIPAL ===== */
    .container {
      min-height: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: space-between;
      padding: 40px 20px 28px;
      max-width: 420px;
      margin: 0 auto;
    }
    
    /* ===== LOGO (topo) ===== */
    .logo {
      margin-top: 0px;
      margin-bottom: 20px;
      display: flex;
      justify-content: center;
      align-items: center;
    }
    .logo img,
    .logo svg {
      width: 70%;
      height: 70%;
      object-fit: contain;
	  filter: drop-shadow(0 0 12px rgba(34, 197, 94, 0.25));
    }
    
    /* ===== ÁREA DOS BOTÕES ===== */
    .buttons {
      width: 100%;
      display: flex;
      flex-direction: column;
      gap: 16px;
      flex: 1;
      justify-content: center;
    }

    /* ===== BOTÃO WHATSAPP (destaque) ===== */
    .btn-whatsapp {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 12px;
      width: 100%;
      height: 64px;
      border-radius: 999px;
      background: #25D366;
      color: #ffffff;
      font-size: 17.5px;
      font-weight: 600;
      text-decoration: none;
      box-shadow: 
        0 0 20px rgba(37, 211, 102, 0.45),
        0 6px 20px rgba(0, 0, 0, 0.4);
      transition: transform 0.15s ease, box-shadow 0.15s ease;
    }

    .btn-whatsapp:active {
      transform: scale(0.97);
    }

    .btn-whatsapp svg {
      width: 26px;
      height: 26px;
      fill: #ffffff;
    }

    /* ===== TÍTULO "SOMOS SOCIÁVEIS" ===== */
    .social-title {
      text-align: center;
      font-size: 15px;
      font-weight: 500;
      color: #a3a3a3;
      letter-spacing: 0.3px;
      margin: 8px 0 4px;
    }

    /* ===== GRID 2x2 DAS REDES ===== */
    .social-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
      width: 100%;
    }

    .btn-social {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      height: 58px;
      border-radius: 18px;
      color: #ffffff;
      font-size: 15.5px;
      font-weight: 600;
      text-decoration: none;
      transition: transform 0.15s ease, box-shadow 0.15s ease;
    }

    .btn-social:active {
      transform: scale(0.96);
    }

    .btn-social svg {
      width: 22px;
      height: 22px;
      fill: currentColor;
    }

    /* ===== CORES + GLOW SUTIL ===== */
    .btn-instagram {
      background: linear-gradient(45deg, #f09433 0%, #e6683c 25%, #dc2743 50%, #cc2366 75%, #bc1888 100%);
      box-shadow: 0 0 16px rgba(220, 39, 67, 0.35);
    }

    .btn-tiktok {
      background: #000000;
      border: 1px solid #2a2a2a;
      box-shadow: 0 0 16px rgba(255, 255, 255, 0.08);
    }

    .btn-facebook {
      background: #1877F2;
      box-shadow: 0 0 16px rgba(24, 119, 242, 0.4);
    }

    .btn-google {
      background: linear-gradient(135deg, #4285F4 0%, #34A853 35%, #FBBC05 70%, #EA4335 100%);
      box-shadow: 0 0 16px rgba(66, 133, 244, 0.35);
    }

    /* ===== RODAPÉ ===== */
    .footer {
      margin-top: 36px;
      padding-top: 20px;
      border-top: 1px solid #222;
      width: 100%;
      text-align: center;
      text-decoration: none;
      color: inherit;
    }

    .footer-brand {
      font-size: 20px;
      font-weight: 700;
      letter-spacing: 1px;
      color: #e5e5e5;
      background: linear-gradient(90deg, #d4af37, #c9a227);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }

    .footer-link {
      display: block;
      margin-top: 3px;
      font-size: 12px;
      color: #666;
    }
  </style>

  <!-- JS leve (opcional – apenas feedback tátil em dispositivos touch) -->
  <script>
    // Adiciona feedback visual extra em dispositivos touch
    document.querySelectorAll('a[class*="btn"]').forEach(btn => {
      btn.addEventListener('touchstart', () => {
        btn.style.opacity = '0.9';
      }, { passive: true });
      btn.addEventListener('touchend', () => {
        btn.style.opacity = '1';
      }, { passive: true });
    });
  </script>
