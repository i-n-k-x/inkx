<style>
  /* ===== RESET E BASE ===== */
  * {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    -webkit-tap-highlight-color: transparent;
  }

  html, body {
    height: 100%;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    background: #ff8692;
    color: #ffffff;
    overflow-x: hidden;
  }

  /* ===== BACKGROUND DECORATIVO ===== */
  body {
    position: relative;
    isolation: isolate;
  }

  body::before {
    content: "";
    position: fixed;
    inset: 0;
    background-image: url("assets/background_duo.png");
    background-repeat: repeat;
    background-size: 227px 454px;
    background-position: center top;
    opacity: 0.60;
    pointer-events: none;
    z-index: -1;
  }

  /* ===== CONTAINER PRINCIPAL ===== */
  .container {
    min-height: 100%;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: space-between;
    padding: 24px 0 28px;
    max-width: 420px;
    margin: 0 auto;
  }

  /* ===== LOGO (só o texto) ===== */
  .logo {
    width: 100%;
    padding: 12px 0 8px;
    display: flex;
    justify-content: center;
    align-items: center;
  }

  .logo img {
    width: 80%;                 /* 80% da tela (10% de cada lado) */
    max-width: 340px;
    height: auto;
    display: block;
    filter: drop-shadow(0 2px 12px rgba(0, 0, 0, 0.25));
  }

  /* ===== ÁREA DOS BOTÕES ===== */
  .buttons {
    width: 100%;
    display: flex;
    flex-direction: column;
    gap: 16px;
    flex: 1;
    justify-content: center;
    padding: 0 20px;
  }

  /* ===== COPOS (colados no WhatsApp) ===== */
  .copos {
    width: 100%;
    margin: 0;
    padding: 0;
    line-height: 0;
    text-align: center;
  }

  .copos img {
    width: 72%;                 /* 20% maior que o tamanho original (60%) */
    max-width: 288px;
    height: auto;
    display: block;
    margin: 0 auto;
    filter: drop-shadow(0 4px 14px rgba(0, 0, 0, 0.18));
  }

  /* ===== BOTÃO WHATSAPP (destaque) ===== */
  .btn-whatsapp {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 13px;
    width: 100%;
    height: 64px;
    margin-top: -17px;          /* anula o gap de 16px do flex + 1px de sobreposição sobre os copos */
    position: relative;
    z-index: 1;
    border-radius: 999px;
    background: #038A06;
    color: #ffffff;
    font-size: 18px;
    font-weight: 700;
    text-decoration: none;
    box-shadow: 
      0 0 24px rgba(186, 255, 201, 0.5),
      0 4px 16px rgba(0, 0, 0, 0.25);
    transition: transform 0.15s ease, box-shadow 0.15s ease;
  }

  .btn-whatsapp:active {
    transform: scale(0.97);
  }

  .btn-whatsapp svg {
    width: 26px;
    height: 26px;
    fill: #ffffff;
  }

  /* ===== TÍTULO DE DESCRIÇÃO ===== */
  .social-title {
    text-align: center;
    font-size: 14px;
    font-weight: 500;
    color: #ffffff;
    letter-spacing: -0.3px;
    margin: 4px 0 2px;
    opacity: 0.95;
  }

  /* ===== GRID 2x2 DAS REDES + REVIEW ===== */
  .social-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 12px;
    width: 100%;
  }

  .btn-social {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 10px;
    height: 58px;
    border-radius: 18px;
    color: #FAEEDE;
    font-size: 15.5px;
    font-weight: 600;
    text-decoration: none;
    transition: transform 0.15s ease, box-shadow 0.15s ease;
  }

  .btn-social:active {
    transform: scale(0.96);
  }

  .btn-social svg {
    width: 22px;
    height: 22px;
    fill: currentColor;
  }

  /* ===== CORES + SOMBRA SUTIL ===== */
  .btn-instagram {
    background: linear-gradient(45deg, #f09433 0%, #e6683c 25%, #dc2743 50%, #cc2366 75%, #bc1888 100%);
    box-shadow:
      0 0 22px rgba(230, 104, 60, 0.55),
      0 4px 16px rgba(0, 0, 0, 0.25);
  }

  .btn-ifood {
    background: #EA1D2C;
    color: #ffffff;
    box-shadow:
      0 0 22px rgba(234, 29, 44, 0.6),
      0 4px 16px rgba(0, 0, 0, 0.25);
  }

  .btn-google-maps {
    background: #FAEEDE;
    color: #333333;
    border: 1px solid #e0e0e0;
    box-shadow:
      0 0 18px rgba(255, 255, 255, 0.22),
      0 4px 14px rgba(0, 0, 0, 0.2);
  }

  .btn-avaliar {
    background: #FAEEDE;
    color: #333333;
    border: 1px solid #e0e0e0;
    box-shadow:
      0 0 18px rgba(255, 255, 255, 0.22),
      0 4px 14px rgba(0, 0, 0, 0.2);
  }

  /* ===== REVIEW-AREA ===== */
  .review-area {
    grid-column: 2;
    grid-row: 3;
    display: flex;
    flex-direction: column;
    align-items: flex-end;
    gap: 2px;
    padding-top: 4px;
    width: 100%;
  }

  .review-arrow {
    width: 22px;
    height: 24px;
    fill: #FFD400;
    filter: drop-shadow(0 2px 5px rgba(0, 0, 0, 0.35));
    animation: bounce 1.6s ease-in-out infinite;
    align-self: center;
  }

  .review-labels {
    display: flex;
    flex-direction: column;
    gap: 0;
  }

  .review-title {
    font-size: 14px;
    font-weight: 600;
    color: #ffffff;
    letter-spacing: 0.2px;
    line-height: 1.05;
  }

  .review-text {
    font-size: 14px;
    font-weight: 600;
    color: #ffffff;
    letter-spacing: 0.2px;
    opacity: 0.95;
    line-height: 1.05;
  }

  .review-stars {
    display: flex;
    gap: 4px;
    font-size: 22px;
    line-height: 1;
    color: #f4b400;
    filter: drop-shadow(0 2px 4px rgba(244, 180, 0, 0.6));
  }

  @keyframes bounce {
    0%, 100% { transform: translateY(0); }
    50% { transform: translateY(-4px); }
  }

  /* ===== RODAPÉ ===== */
  .footer {
    margin-top: 36px;
    padding-top: 20px;
    border-top: 1px solid rgba(255, 255, 255, 0.25);
    width: 100%;
    text-align: center;
    text-decoration: none;
    color: inherit;
    display: block;
    cursor: pointer;
    padding-left: 20px;
    padding-right: 20px;
  }

  .footer-brand {
    font-size: 11px;
    font-weight: 600;
    letter-spacing: 0.5px;
    color: rgba(255, 255, 255, 0.85);
  }

  .footer-brand .inkx {
    letter-spacing: -0.5px;
  }

  .footer-link {
    display: block;
    margin-top: 4px;
    font-size: 9px;
    color: rgba(255, 255, 255, 0.65);
    line-height: 1.4;
  }

  /* ===== ANIMAÇÕES PREMIUM - SOMENTE MOBILE ===== */
  @media (max-width: 768px) {
    /* Estado inicial (invisível + levemente deslocado) */
    .logo,
    .copos,
    .btn-whatsapp,
    .social-title,
    .btn-social,
    .review-area {
      opacity: 0;
      transform: translateY(32px) scale(0.96);
      will-change: transform, opacity;
    }

    /* Quando a animação de entrada é ativada */
    .logo.animate-in,
    .copos.animate-in,
    .btn-whatsapp.animate-in,
    .social-title.animate-in,
    .btn-social.animate-in,
    .review-area.animate-in {
      opacity: 1;
      transform: translateY(0) scale(1);
      transition: 
        opacity 1.15s cubic-bezier(0.16, 1, 0.3, 1),
        transform 1.15s cubic-bezier(0.16, 1, 0.3, 1);
    }

    /* Delays sequenciais mais lentos e elegantes */
    .logo.animate-in            { transition-delay: 0.10s; }
    .copos.animate-in           { transition-delay: 0.35s; }
    .btn-whatsapp.animate-in    { transition-delay: 0.55s; }
    .social-title.animate-in    { transition-delay: 0.75s; }
    
    .btn-instagram.animate-in   { transition-delay: 0.90s; }
    .btn-ifood.animate-in       { transition-delay: 1.05s; }
    .btn-google-maps.animate-in { transition-delay: 1.20s; }
    .btn-avaliar.animate-in     { transition-delay: 1.35s; }
    
    .review-area.animate-in     { transition-delay: 1.55s; }

    /* ===== LOGO FLUTUANTE CONTÍNUA (efeito porta sutil) ===== */
    .logo.animate-in {
      perspective: 900px;
    }

    .logo.animate-in img {
      transform-origin: center center;
      transform-style: preserve-3d;
      will-change: transform;
      animation: logoFloat 5.8s ease-in-out infinite;
      animation-delay: 1.5s; /* começa depois da entrada terminar */
    }
  }

  /* Movimento contínuo sutil da logo (eixo central como porta) */
  @keyframes logoFloat {
    0% {
      transform: rotateY(-5.5deg) translateY(0);
    }
    50% {
      transform: rotateY(5.5deg) translateY(-5px);
    }
    100% {
      transform: rotateY(-5.5deg) translateY(0);
    }
  }
</style>

  <script>
    // Animações premium - somente em dispositivos móveis
    if (window.matchMedia('(max-width: 768px)').matches) {
      window.addEventListener('load', () => {
        // Pequeno delay para garantir que as imagens carregaram
        setTimeout(() => {
          const elements = [
            '.logo',
            '.copos',
            '.btn-whatsapp',
            '.social-title',
            '.btn-instagram',
            '.btn-ifood',
            '.btn-google-maps',
            '.btn-avaliar',
            '.review-area'
          ];

          elements.forEach(selector => {
            const el = document.querySelector(selector);
            if (el) el.classList.add('animate-in');
          });
        }, 80);
      });
    }

    // Feedback de toque nos botões
    document.querySelectorAll('a[class*="btn"]').forEach(btn => {
      btn.addEventListener('touchstart', () => {
        btn.style.opacity = '0.9';
      }, { passive: true });
      btn.addEventListener('touchend', () => {
        btn.style.opacity = '1';
      }, { passive: true });
    });
  </script>
